name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Job 1: Build Backend Services
  # ============================================
  build-backend:
    name: Build Backend Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ride-service, driver-service, matching-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build ${{ matrix.service }}
        working-directory: Backend/${{ matrix.service }}
        run: |
          mvn clean install -DskipTests
          echo "✅ ${{ matrix.service }} built successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.service }}-jar
          path: Backend/${{ matrix.service }}/target/*.jar
          retention-days: 1

  # ============================================
  # Job 2: Build Frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm run build
          echo "✅ Frontend built successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  # ============================================
  # Job 3: Code Quality & Security Scan
  # ============================================
  code-quality:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone for better analysis

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze ride-service
        working-directory: Backend/ride-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=uber-ride-service \
            -Dsonar.projectName="Uber Ride Service" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN || echo "⚠️ SonarQube not configured"
        continue-on-error: true

      - name: Build and analyze driver-service
        working-directory: Backend/driver-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=uber-driver-service \
            -Dsonar.projectName="Uber Driver Service" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN || echo "⚠️ SonarQube not configured"
        continue-on-error: true

      - name: Build and analyze matching-service
        working-directory: Backend/matching-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=uber-matching-service \
            -Dsonar.projectName="Uber Matching Service" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN || echo "⚠️ SonarQube not configured"
        continue-on-error: true

      - name: Set up Node.js for Frontend Analysis
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Analyze Frontend with SonarQube
        working-directory: Frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=uber-frontend \
            -Dsonar.projectName="Uber Frontend" \
            -Dsonar.sources=src \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN || echo "⚠️ SonarQube not configured"
        continue-on-error: true

      - name: Analysis Summary
        run: |
          echo "✅ SonarQube analysis completed"
          echo "📊 View results at your SonarQube/SonarCloud dashboard"

  # ============================================
  # Job 4: Build & Push Docker Images to Docker Hub
  # ============================================
  build-push-docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: vars
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ride-service
        working-directory: Backend/ride-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:${{ env.TAG }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:${{ env.TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:${{ env.TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:latest
          echo "✅ ride-service:${{ env.TAG }} pushed to Docker Hub"

      - name: Build and push driver-service
        working-directory: Backend/driver-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:${{ env.TAG }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:${{ env.TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:${{ env.TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:latest
          echo "✅ driver-service:${{ env.TAG }} pushed to Docker Hub"

      - name: Build and push matching-service
        working-directory: Backend/matching-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:${{ env.TAG }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:${{ env.TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:${{ env.TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:latest
          echo " matching-service:${{ env.TAG }} pushed to Docker Hub"

      - name: Build and push frontend
        working-directory: Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:${{ env.TAG }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:${{ env.TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:${{ env.TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:latest
          echo "✅ frontend:${{ env.TAG }} pushed to Docker Hub"

      - name: Docker Hub deployment summary
        run: |
          echo "====================================="
          echo "✅ Docker Images Published!"
          echo "====================================="
          echo "📦 Version: ${{ env.TAG }}"
          echo ""
          echo "📦 Images available on Docker Hub:"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:${{ env.TAG }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:${{ env.TAG }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:${{ env.TAG }}"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:${{ env.TAG }}"
          echo "  - [All services also tagged as :latest]"
          echo ""
          echo "🚀 To pull and run on your local machine:"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:${{ env.TAG }}"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:${{ env.TAG }}"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:${{ env.TAG }}"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:${{ env.TAG }}"
          echo ""
          echo "Or pull latest versions:"
          echo "  docker compose pull"
          echo "====================================="

  # ============================================
  # Job 5: Deploy to Local Docker (Self-Hosted)
  # ============================================
  deploy-local:
    name: Deploy to Local Docker
    runs-on: self-hosted
    needs: [build-push-docker]
    if: github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    defaults:
      run:
        shell: powershell
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest images from Docker Hub
        run: |
          echo "Pulling latest images from Docker Hub..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-ride-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-driver-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-matching-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uber-frontend:latest
          echo "All images pulled successfully"

      - name: Start services with docker compose
        run: |
          echo "Starting all services..."
          $env:DOCKERHUB_USERNAME = "${{ secrets.DOCKERHUB_USERNAME }}"
          docker compose up -d
          echo "Waiting for services to initialize..."
          Start-Sleep -Seconds 30

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "Local Deployment Successful!"
          echo "======================================"
          echo "Version: v${{ github.run_number }}"
          echo "Services available at:"
          echo "  - Ride Service: http://localhost:8081"
          echo "  - Driver Service: http://localhost:8082"
          echo "  - Matching Service: http://localhost:8083"
          echo "  - Frontend: http://localhost"
          echo "  - PostgreSQL: localhost:5432"
          echo "  - Kafka: localhost:9092"
          echo "======================================"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Deployment failed - rolling back..."
          docker compose down
          echo "Cleanup completed"

  # ============================================
  # Job 6: Pipeline Summary
  # ============================================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, code-quality, build-push-docker, deploy-local]
    if: always()
    
    steps:
      - name: Success summary
        if: needs.deploy-local.result == 'success'
        run: |
          echo "======================================"
          echo "✅ CI/CD Pipeline Completed Successfully!"
          echo "======================================"
          echo "✅ Backend: Built, tested, and published"
          echo "✅ Frontend: Built successfully"
          echo "✅ Code Quality: SonarQube analysis complete"
          echo "✅ Docker Images: Published to Docker Hub"
          echo "✅ Local Deployment: Services running on your machine"
          echo ""
          echo "🎉 All checks passed!"
          echo "======================================"

      - name: Failure summary
        if: needs.build-backend.result == 'failure' || needs.build-frontend.result == 'failure' || needs.build-push-docker.result == 'failure' || needs.deploy-local.result == 'failure'
        run: |
          echo "======================================"
          echo "❌ Pipeline Failed!"
          echo "======================================"
          echo "Backend: ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Docker Push: ${{ needs.build-push-docker.result }}"
          echo "Local Deploy: ${{ needs.deploy-local.result }}"
          echo ""
          echo "⚠️ Check the logs above for details"
          echo "======================================"
