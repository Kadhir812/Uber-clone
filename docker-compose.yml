services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - d:/uber-topic/zookeeper_data:/var/lib/zookeeper/data
      - d:/uber-topic/zookeeper_log:/var/lib/zookeeper/log
    networks:
      - uber-network

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092" 
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - d:/uber-topic/kafka_data:/var/lib/kafka/data
    networks:
      - uber-network
  # ============================================
  # PostgreSQL Database
  # Creates separate databases for each service:
  # - uber_ride_db (ride-service)
  # - uber_driver_db (driver-service)
  # Uses environment variables from .env file
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: uber-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - d:/uber-topic/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - uber-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Services
  # ============================================
  ride-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/uber-ride-service:latest
    container_name: uber-ride-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/uber_ride_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - uber-network
    restart: unless-stopped

  driver-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/uber-driver-service:latest
    container_name: uber-driver-service
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/uber_driver_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - uber-network
    restart: unless-stopped

  matching-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/uber-matching-service:latest
    container_name: uber-matching-service
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - uber-network
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/uber-frontend:latest
    container_name: uber-frontend
    depends_on:
      - ride-service
      - driver-service
      - matching-service
    ports:
      - "80:80"
    networks:
      - uber-network
    restart: unless-stopped



networks:
  uber-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
